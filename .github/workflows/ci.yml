name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Design SSOT Audit
        run: npm run verify:ssot:design

      - name: NBA Structural Baseline Assertion
        id: nba_structural_assertion
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:nba-structural-baseline

      - name: NBA Structural Baseline Summary
        if: ${{ always() }}
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "NBA Structural Baseline Assertion: skipped (missing SUPABASE_SERVICE_ROLE_KEY)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NBA Structural Baseline Assertion: ${{ steps.nba_structural_assertion.conclusion }}" >> "$GITHUB_STEP_SUMMARY"
          fi
