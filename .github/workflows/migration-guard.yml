name: migration-guard

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/validate-migrations.mjs"
      - ".github/workflows/migration-guard.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate migration naming and version uniqueness
        run: npm run check:migrations

      - name: NBA Structural Baseline Assertion
        id: nba_structural_assertion
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:nba-structural-baseline

      - name: NBA Structural Baseline Summary
        if: ${{ always() }}
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "NBA Structural Baseline Assertion: skipped (missing SUPABASE_SERVICE_ROLE_KEY)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NBA Structural Baseline Assertion: ${{ steps.nba_structural_assertion.conclusion }}" >> "$GITHUB_STEP_SUMMARY"
          fi
